[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-redsys"
version = "1.0.1"
description = "Django views, URLs and signals for RedSys TPV Virtual payments, on top of python-redsys."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "David Díaz", email = "d.diazp@gmail.com" }]
keywords = ["django", "redsys", "sermepa", "tpv", "payments"]
dependencies = ["Django>=5.2", "python-redsys>=2.2"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/ddiazpinto/django-redsys"
Source = "https://github.com/ddiazpinto/django-redsys"

[dependency-groups]
test = ["pytest>=8.4", "pytest-cov", "pytest-django>=4.11"]
lint = ["ruff"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.setuptools.packages.find]
include = ["django_redsys*"]

[tool.setuptools.package-data]
django_redsys = ["templates/django_redsys/*.html"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "single"
